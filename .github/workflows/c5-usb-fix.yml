name: Build ESP32-C5 no-AP diagnostic

on:
  push:
    branches: [c5-usb-fix-v1, c5-no-ap-test]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-c5:
    name: Build esp32c5-generic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/cache@v4
        id: cache-idf
        with:
          path: |
            ~/esp-idf
            ~/.espressif
          key: esp-idf-v6.1-${{ runner.os }}-v1

      - name: Install dependencies
        if: steps.cache-idf.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget git flex bison gperf python3-pip python3-setuptools cmake ninja-build ccache libffi-dev libssl-dev dfu-util

      - name: Install ESP-IDF 6.1
        if: steps.cache-idf.outputs.cache-hit != 'true'
        run: |
          git clone -b v6.1 --depth 1 --recursive https://github.com/espressif/esp-idf.git ~/esp-idf
          ~/esp-idf/install.sh

      - name: Repair ESP-IDF Python environment
        if: steps.cache-idf.outputs.cache-hit == 'true'
        run: |
          IDF_VER=$(sed -nE 's/^#define ESP_IDF_VERSION_(MAJOR|MINOR) +([0-9]+)/\2/p' ~/esp-idf/components/esp_common/include/esp_idf_version.h | paste -sd.)
          PY_VER=$(python3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
          VENV="$HOME/.espressif/python_env/idf${IDF_VER}_py${PY_VER}_env"
          if [ ! -x "$VENV/bin/python" ]; then
            rm -rf "$VENV"
            ~/esp-idf/install.sh
          fi

      - name: Configure C5 build
        run: |
          rm -f sdkconfig sdkconfig.defaults
          cp configs/sdkconfig.default.esp32c5 sdkconfig.defaults
          cp configs/sdkconfig.default.esp32c5 sdkconfig
          printf "\n# CONFIG_FATFS_USE_DYN_BUFFERS is not set\n" >> sdkconfig.defaults
          printf "\n# CONFIG_FATFS_USE_DYN_BUFFERS is not set\n" >> sdkconfig
          printf "\n# CONFIG_ESP_GDBSTUB_ENABLED is not set\n" >> sdkconfig.defaults
          printf "\n# CONFIG_ESP_GDBSTUB_ENABLED is not set\n" >> sdkconfig

      - name: Patch ESP-IDF gdbstub compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          idf = Path.home() / "esp-idf"
          p = idf / "components/esp_gdbstub/src/gdbstub.c"
          s = p.read_text(encoding="utf-8")
          guard = re.compile(r"#if\s*\(?\s*CONFIG_ESP_SYSTEM_GDBSTUB_RUNTIME\s*\|\|\s*CONFIG_ESP_GDBSTUB_SUPPORT_TASKS\s*\)?")
          if guard.search(s):
              p.write_text(guard.sub("#if 1", s), encoding="utf-8")
          PY

      - name: Build
        env:
          SDKCONFIG_DEFAULTS: sdkconfig.defaults
        run: |
          . ~/esp-idf/export.sh
          export IDF_TARGET=esp32c5
          export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)
          idf.py clean
          idf.py build

      - name: Package firmware
        run: |
          mkdir -p artifacts/esp32c5-generic-v01
          cp build/partition_table/partition-table.bin artifacts/esp32c5-generic-v01/partitions.bin
          cp build/bootloader/bootloader.bin artifacts/esp32c5-generic-v01/bootloader.bin
          cp build/Ghost_ESP_IDF.bin artifacts/esp32c5-generic-v01/firmware.bin
          cp build/Ghost_ESP_IDF.elf artifacts/esp32c5-generic-v01/esp32c5-generic-v01.elf
          . ~/esp-idf/export.sh
          python3 - <<'PY'
          import pathlib, struct, subprocess, re
          t=pathlib.Path("artifacts/esp32c5-generic-v01/partitions.bin").read_bytes()
          fmt="<2sBBLL16sL"; sz=struct.calcsize(fmt)
          apps=[]
          for pos in range(0,len(t)-sz+1,sz):
              magic,ptype,subtype,offset,size,label,flags=struct.unpack(fmt,t[pos:pos+sz])
              if magic != bytes((0xAA,0x50)): break
              if ptype == 0: apps.append(offset)
          if not apps: raise SystemExit("No app partition found")
          app=min(apps)
          p=pathlib.Path("build/config/sdkconfig.h").read_text()
          def get(name, default):
              m=re.search(rf'^#define {name} "([^"]+)"',p,re.M)
              return m.group(1) if m else default
          subprocess.run([
              "python","-m","esptool","--chip","esp32c5","merge-bin",
              "-o","artifacts/esp32c5-generic-v01/merged.bin",
              "--flash-mode",get("CONFIG_ESPTOOLPY_FLASHMODE","dio"),
              "--flash-freq",get("CONFIG_ESPTOOLPY_FLASHFREQ","40m"),
              "--flash-size",get("CONFIG_ESPTOOLPY_FLASHSIZE","4MB"),
              "0x0","artifacts/esp32c5-generic-v01/bootloader.bin",
              "0x8000","artifacts/esp32c5-generic-v01/partitions.bin",
              hex(app),"artifacts/esp32c5-generic-v01/firmware.bin"
          ],check=True)
          PY
          cd artifacts
          zip -r ../esp32c5-generic-v01-C5-NO-AP.zip esp32c5-generic-v01

      - name: Upload C5 firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32c5-generic-no-ap-v01
          path: esp32c5-generic-v01-C5-NO-AP.zip

      # Release creation intentionally omitted: the diagnostic ZIP is provided as a workflow artifact.\n