name: C5 TEST - USB Primary Guard v4
on:
  push:
    branches: [c5-usb-v4-primary-guard]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/cache@v4
        id: cache-idf
        with:
          path: |
            ~/esp-idf
            ~/.espressif
          key: esp-idf-v6.1-${{ runner.os }}-usb-primary-guard-v2
      - name: Install host dependencies
        if: steps.cache-idf.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget git flex bison gperf python3-pip python3-setuptools cmake ninja-build ccache libffi-dev libssl-dev dfu-util
      - name: Install ESP-IDF 6.1
        if: steps.cache-idf.outputs.cache-hit != 'true'
        run: |
          git clone -b v6.1 --depth 1 --recursive https://github.com/espressif/esp-idf.git ~/esp-idf
          ~/esp-idf/install.sh esp32c5
      - name: Configure C5
        run: |
          rm -f sdkconfig sdkconfig.defaults
          cp configs/sdkconfig.default.esp32c5 sdkconfig.defaults
          cp configs/sdkconfig.default.esp32c5 sdkconfig
          printf "\n# USB Serial-JTAG primary console guard build\n" >> sdkconfig.defaults
          printf "# CONFIG_FATFS_USE_DYN_BUFFERS is not set\n" >> sdkconfig.defaults
          printf "# CONFIG_ESP_GDBSTUB_ENABLED is not set\n" >> sdkconfig.defaults
      - name: Build
        run: |
          . ~/esp-idf/export.sh
          export IDF_TARGET=esp32c5
          export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)
          idf.py clean
          idf.py build
      - name: Size report
        run: |
          . ~/esp-idf/export.sh
          export IDF_TARGET=esp32c5
          idf.py size
          idf.py size-components
      - name: Package
        run: |
          set -e
          mkdir -p artifacts/esp32c5-usb-primary-guard
          cp build/partition_table/partition-table.bin artifacts/esp32c5-usb-primary-guard/partitions.bin
          cp build/bootloader/bootloader.bin artifacts/esp32c5-usb-primary-guard/bootloader.bin
          cp build/Ghost_ESP_IDF.bin artifacts/esp32c5-usb-primary-guard/firmware.bin
          cp build/Ghost_ESP_IDF.elf artifacts/esp32c5-usb-primary-guard/esp32c5-usb-primary-guard.elf
          . ~/esp-idf/export.sh
          python -m esptool --chip esp32c5 merge-bin -o artifacts/esp32c5-usb-primary-guard/merged.bin --flash-mode dio --flash-freq 40m --flash-size 4MB 0x0 artifacts/esp32c5-usb-primary-guard/bootloader.bin 0x8000 artifacts/esp32c5-usb-primary-guard/partitions.bin 0x10000 artifacts/esp32c5-usb-primary-guard/firmware.bin
          cd artifacts
          zip -r ../esp32c5-usb-primary-guard.zip esp32c5-usb-primary-guard
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32c5-usb-primary-guard
          path: esp32c5-usb-primary-guard.zip
