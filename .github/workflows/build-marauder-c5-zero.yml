          needle = '#if defined(HAS_SD) && !defined(HAS_C5_SD)\n  SDInterface sd_obj;\n#endif'
          repl = '#if defined(HAS_SD) && !defined(HAS_C5_SD)\n  SDInterface sd_obj;\n#elif defined(MARAUDER_C5_ZERO)\n  SDInterface sd_obj;\n#endif'
          if "elif defined(MARAUDER_C5_ZERO)" not in s:
